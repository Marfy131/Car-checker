<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{app.title}">Car Watcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/" th:text="#{app.title}">Car Watcher</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cars}" th:text="#{nav.cars}">Cars</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/schedules}" th:text="#{nav.schedules}">Schedules</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/history}" th:text="#{nav.history}">History</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notifications}" th:text="#{nav.notifications}">Notifications</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/settings}" th:text="#{nav.settings}">Settings</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/monitoring}" th:text="#{nav.monitoring}">Monitoring</a></li>
            </ul>
            <div class="navbar-nav">
                <span class="nav-link text-white-50" th:text="#{nav.language}">Language</span>
                <a class="nav-link" th:href="@{''(lang='sk')}">SK</a>
                <a class="nav-link" th:href="@{''(lang='en')}">EN</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:replace="${content}">Content</div>
</div>

<footer class="container mt-5 mb-3 text-center text-muted">
    <p th:text="#{footer.text}">Car Watcher © 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
