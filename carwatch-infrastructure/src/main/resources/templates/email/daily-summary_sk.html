<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Denný prehľad vozidiel</title>
</head>
<body>
<p>Dobrý deň,</p>
<p>posielam denný prehľad vozidiel k <span th:text="${generatedAt}">2024-01-01 08:00</span>.</p>

<div th:if="${not #lists.isEmpty(warnings)}">
    <h3>Súhrn upozornení:</h3>
    <ul>
        <li th:each="warning : ${warnings}" th:text="${warning}">Upozornenie</li>
    </ul>
</div>

<h3>Vozidlá:</h3>
<div th:each="car : ${cars}">
    <h4 th:text="|${car.name} (${car.licensePlate})|">Auto (XX-000-XX)</h4>
    <ul>
        <li th:each="item : ${car.items}">
            <span th:text="${item.label}">Názov</span>: <span th:text="${item.expiry}">-</span> [<span th:text="${item.status}">UNKNOWN</span>]
        </li>
    </ul>
</div>

<div th:if="${not #lists.isEmpty(recentRuns)}">
    <h3>Posledné spustenia kontrol:</h3>
    <ul>
        <li th:each="run : ${recentRuns}" th:text="${run}">Kontrola</li>
    </ul>
</div>

<p>S pozdravom,<br/>Car Watcher</p>
</body>
</html>
