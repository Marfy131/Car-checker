<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Daily vehicle status</title>
</head>
<body>
<p>Hello,</p>
<p>here is the daily vehicle status as of <span th:text="${generatedAt}">2024-01-01 08:00</span>.</p>

<div th:if="${not #lists.isEmpty(warnings)}">
    <h3>Warnings summary:</h3>
    <ul>
        <li th:each="warning : ${warnings}" th:text="${warning}">Warning</li>
    </ul>
</div>

<h3>Vehicles:</h3>
<div th:each="car : ${cars}">
    <h4 th:text="|${car.name} (${car.licensePlate})|">Car (XX-000-XX)</h4>
    <ul>
        <li th:each="item : ${car.items}">
            <span th:text="${item.label}">Label</span>: <span th:text="${item.expiry}">-</span> [<span th:text="${item.status}">UNKNOWN</span>]
        </li>
    </ul>
</div>

<div th:if="${not #lists.isEmpty(recentRuns)}">
    <h3>Last check runs:</h3>
    <ul>
        <li th:each="run : ${recentRuns}" th:text="${run}">Check</li>
    </ul>
</div>

<p>Best regards,<br/>Car Watcher</p>
</body>
</html>
