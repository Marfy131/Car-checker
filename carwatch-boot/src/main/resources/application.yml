spring:
  application:
    name: carwatch
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:sqlite:data/carwatch.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

logging:
  level:
    com.carwatch: DEBUG
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

carwatch:
  scheduler:
    enabled: true
    poll-delay-ms: 30000
    claim-lock-ttl: PT5M
    execution-parallelism: 2
  history:
    page-size: 100
  notifications:
    page-size: 100
    daily-summary:
      recent-runs: 10
  email:
    enabled: ${CARWATCH_EMAIL_ENABLED:false}
    from: ${CARWATCH_EMAIL_FROM:carwatcher@localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

javamelody:
  enabled: true
  spring-monitoring-enabled: true
  init-parameters:
    log: true
