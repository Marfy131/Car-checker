spring:
  datasource:
    url: "jdbc:sqlite:file:carwatch-test?mode=memory&cache=shared"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

carwatch:
  scheduler:
    enabled: false
