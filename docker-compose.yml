version: '3.8'

services:

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "${MAILDEV_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILDEV_WEB_PORT:-1080}:1080"   # Web UI → http://localhost:1080
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - db:/opt/carwatch/data
      - logs:/opt/carwatch/logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MAIL_HOST: maildev
      MAIL_PORT: "1025"
      CARWATCH_EMAIL_ENABLED: "true"
      CARWATCH_EMAIL_FROM: carwatch@localhost
      # maildev needs no auth or TLS
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    depends_on:
      - maildev
    restart: unless-stopped

volumes:
  db:
  logs:
